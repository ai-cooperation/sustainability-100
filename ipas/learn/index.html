<!-- Init -->
<script>
  ThreeQuestionEngine.init({
    contentPack: S100_CONTENT,
    apiProxy: S100_CONTENT.apiProxy,
    firebase: S100_CONTENT.firebase,
    teacherEmail: S100_CONTENT.teacherEmail
  });
  TQE_UI.renderEntry();
  ThreeQuestionEngine.initFirebase(function(user) {
    TQE_UI.renderEntry();
    if (user && user.email === 'alan.chen75@gmail.com') {
      var link = document.getElementById('tqeTeacherLink');
      if (link) link.style.display = 'inline-block';
    }
    // Update auth UI
    var loginBtn = document.getElementById('tqeBtnGoogleLogin');
    var avatar = document.getElementById('tqeUserAvatar');
    var authStatus = document.getElementById('tqeAuthStatus');
    if (user) {
      if (loginBtn) loginBtn.style.display = 'none';
      if (avatar) {
        avatar.style.display = 'grid';
        avatar.textContent = (user.displayName || user.email || '').charAt(0);
        avatar.title = user.displayName || user.email;
        avatar.style.cursor = 'pointer';
        avatar.onclick = function() {
          if (confirm('登出？')) ThreeQuestionEngine.googleLogout();
        };
      }
      if (authStatus) authStatus.textContent = '';
    } else {
      if (loginBtn) loginBtn.style.display = 'inline-flex';
      if (avatar) avatar.style.display = 'none';
    }
  });
</script>
